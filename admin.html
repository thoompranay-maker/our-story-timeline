
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Story — Admin</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <header class="admin-header">

        <div>
            <span class="brand-heart">♡</span>
            <h1>Our Story</h1>
            <p>Memory Administration</p>
        </div>

        <button id="logoutButton">
            Log Out
        </button>

    </header>


    <main class="admin-container">

        <section class="dashboard-intro">

            <div>
                <p class="eyebrow">YOUR MEMORIES</p>

                <h2>
                    Every moment,
                    <span>remembered.</span>
                </h2>

                <p>
                    Add the moments that matter.
                    The timeline will arrange them automatically.
                </p>
            </div>

            <button id="addMemoryButton" class="primary-button">
                + Add Memory
            </button>

        </section>


        <!-- Memory Form -->

        <section
            id="memoryFormSection"
            class="memory-form-section hidden"
        >

            <div class="form-header">

                <div>
                    <p class="eyebrow">NEW MEMORY</p>
                    <h3>Add a special moment</h3>
                </div>

                <button id="closeFormButton" class="close-button">
                    ×
                </button>

            </div>


            <form id="memoryForm">

                <input
                    type="hidden"
                    id="memoryId"
                >


                <div class="form-group">

                    <label for="eventDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="eventDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="The day we first met ❤️"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Write what made this moment special..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="memory">
                            ❤️ Memory
                        </option>

                        <option value="milestone">
                            💍 Milestone
                        </option>

                        <option value="date">
                            🌹 Date
                        </option>

                        <option value="travel">
                            ✈️ Travel
                        </option>

                        <option value="celebration">
                            🎉 Celebration
                        </option>

                        <option value="funny">
                            😂 Funny
                        </option>

                        <option value="family">
                            🏡 Family
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="location">
                        Location
                        <span>(Optional)</span>
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Hyderabad"
                    >

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelButton"
                        class="secondary-button"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Save Memory ❤️
                    </button>

                </div>

                <p id="formMessage"></p>

            </form>

        </section>


        <!-- Memories -->

        <section class="memories-section">

            <div class="section-heading">

                <div>
                    <p class="eyebrow">TIMELINE</p>
                    <h3>All Memories</h3>
                </div>

                <select id="sortOrder">

                    <option value="asc">
                        Oldest First
                    </option>

                    <option value="desc">
                        Newest First
                    </option>

                </select>

            </div>


            <div id="memoriesList">

                <div class="loading">
                    Loading memories...
                </div>

            </div>

        </section>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration -->

    <script src="js/config.js"></script>

    <!-- Admin functionality -->

    <script src="js/admin.js"></script>

</body>

  </html>
