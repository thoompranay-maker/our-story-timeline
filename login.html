<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Story — Private Chapter</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <!-- Login Styles -->
    <link rel="stylesheet" href="css/login.css">

</head>


<body>

    <main class="login-container">

        <!-- Ambient background -->
        <div class="ambient-glow ambient-glow-one"></div>
        <div class="ambient-glow ambient-glow-two"></div>
        <div class="ambient-noise"></div>


        <div class="login-stage">


            <!-- =================================================
                 REAR STORY CARD
                 ================================================= -->

            <section class="story-card" aria-label="Our story">

                <div class="story-card-inner">

                    <p class="story-eyebrow">
                        OUR STORY
                    </p>

                    <h1>
                        The moments<br>
                        that became us.
                    </h1>

                    <div class="story-heart">
                        ♡
                    </div>

                    <div class="story-dates">

                        <div class="story-date">
                            <span>
                                27 JULY 2025
                            </span>

                            <strong>
                                WE SAID YES
                            </strong>
                        </div>


                        <div class="story-divider"></div>


                        <div class="story-date">
                            <span>
                                17 AUGUST 2025
                            </span>

                            <strong>
                                WE BECAME ONE
                            </strong>
                        </div>

                    </div>

                    <p class="story-footer">
                        Every chapter is worth remembering.
                    </p>

                </div>

            </section>



            <!-- =================================================
                 LOGIN CARD
                 ================================================= -->

            <section class="login-card" aria-label="Private memory archive">

                <div class="login-card-glow"></div>

                <div class="login-card-inner">


                    <!-- Small emblem -->

                    <div class="heart" aria-hidden="true">
                        ♡
                    </div>


                    <!-- Heading -->

                    <p class="login-eyebrow">
                        PRIVATE CHAPTER
                    </p>

                    <h2>
                        Our Story
                    </h2>

                    <p class="login-subtitle">
                        Enter the space where<br>
                        our story is kept.
                    </p>


                    <!-- Form -->

                    <form id="loginForm">


                        <div class="input-group">

                            <label for="email">
                                EMAIL ADDRESS
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Your email address"
                                autocomplete="email"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="password">
                                PASSWORD
                            </label>

                            <input
                                type="password"
                                id="password"
                                placeholder="Your password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="login-button"
                        >

                            <span class="button-text">
                                Enter Our Story
                            </span>

                            <span
                                class="button-arrow"
                                aria-hidden="true"
                            >
                                →
                            </span>

                        </button>


                        <p
                            id="loginMessage"
                            class="login-message"
                            aria-live="polite"
                        ></p>

                    </form>


                    <!-- Bottom label -->

                    <div class="private-label">

                        <span class="private-line"></span>

                        <span>
                            PRIVATE ARCHIVE · JUST FOR US
                        </span>

                        <span class="private-line"></span>

                    </div>

                </div>

            </section>


        </div>


        <!-- Bottom page signature -->

        <p class="page-signature">
            A story still being written.
        </p>

    </main>



    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         SUPABASE CONFIGURATION
         ===================================================== -->

    <script src="js/config.js"></script>


    <!-- =====================================================
         LOGIN FUNCTIONALITY
         ===================================================== -->

    <script src="js/auth.js"></script>

</body>

</html>
